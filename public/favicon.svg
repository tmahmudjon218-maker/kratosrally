<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e18"/>
      <stop offset="50%" stop-color="#121828"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="kratosGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b4e"/>
      <stop offset="50%" stop-color="#ff1a35"/>
      <stop offset="100%" stop-color="#cc0820"/>
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#cyberCyan)" stroke-width="3" opacity="0.4"/>
  <g filter="url(#glow)">
    <!-- Cyberdyne Rally Chevrons -->
    <path d="M 330 140 L 420 140 L 370 180 L 280 180 Z" fill="url(#cyberCyan)"/>
    <path d="M 345 200 L 415 200 L 380 230 L 310 230 Z" fill="url(#cyberCyan)" opacity="0.8"/>
    <path d="M 330 330 L 420 330 L 370 370 L 280 370 Z" fill="url(#cyberCyan)"/>
    <!-- Kratos 'K' Emblem -->
    <path d="M 110 110 L 195 110 L 195 402 L 110 402 Z" fill="url(#kratosGrad)"/>
    <path d="M 195 240 L 320 110 L 400 110 L 260 256 Z" fill="url(#kratosGrad)"/>
    <path d="M 235 235 L 405 402 L 315 402 L 195 282 Z" fill="url(#kratosGrad)"/>
  </g>
  <text x="256" y="465" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" font-style="italic" letter-spacing="4" fill="#00f0ff" text-anchor="middle">KRATOS RALLY</text>
</svg>